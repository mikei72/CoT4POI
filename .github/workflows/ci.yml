name: CPU synthetic CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked project environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Test CPU synthetic scope
        run: python -m pytest -q

      - name: Run static deployment checks
        run: python scripts/static_deploy_check.py

      - name: Run fixture evaluation and API closure
        run: |
          python -m next_poi.evaluation \
            --dataset synthetic \
            --train tests/fixtures/synthetic/train.csv \
            --validation tests/fixtures/synthetic/validation.csv \
            --test tests/fixtures/synthetic/test.csv \
            --output artifacts/smoke \
            --tracking-directory "$RUNNER_TEMP/next-poi-smoke/mlruns" \
            --split-protocol fixture-v1 \
            --variant b3
          python -m next_poi.serving.smoke_test \
            --bundle artifacts/smoke/b3/bundle
