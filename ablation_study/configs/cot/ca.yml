dataset:
  name: ca
  root_dir: datasets/ca

artifacts:
  processed_history_dir: datasets/ca
  cot_root_dir: datasets/ca/cot
  macro_output_dir: ablation_study/outputs/cot/ca/macro
  fine_output_dir: ablation_study/outputs/cot/ca/fine

macro_ablation:
  enabled_variants:
    - full
    - w_o_td
    - w_o_preference
  optional_variants:
    - history_only
  metrics:
    - hit@1
    - hit@3
    - hit@5
    - mrr
  prompt_mode: zero_shot

fine_ablation:
  enabled_variants:
    - full
    - w_o_td
    - w_o_preference
    - w_o_macro
  optional_variants:
    - history_only
  metrics:
    - hit@1
    - hit@5
    - hit@10
    - mrr
  reranker_model_name: BAAI/bge-reranker-base
  train_for_ablation: true

runtime:
  dry_run_default: true
  save_predictions: true
  save_metrics: true
