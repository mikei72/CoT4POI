dataset:
  name: nyc
  root_dir: datasets/nyc

artifacts:
  cot_root_dir: datasets/nyc/cot
  merge_source_dir: datasets/nyc
  final_output_dir: ablation_study/outputs/final_llm/nyc

end2end_ablation:
  enabled_variants:
    - full
    - w_o_fine
    - w_o_macro
    - w_o_preference
  metrics:
    - hit@1
    - hit@5
    - hit@10
    - mrr
  use_end2end_chain_ablation: true
  train_required: true

input_masking_analysis:
  enabled: false
  optional_variants:
    - preference
    - macro
    - fine
  inference_only_if_possible: true

training:
  model_name_or_path: model/Llama-2-7b-longlora-32k-ft
  output_dir: experiment/nyc
  model_max_length: 32768
  use_flash_attn: true
  low_rank_training: true
  num_train_epochs: 10
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  learning_rate: 2e-5
  warmup_steps: 20
  lr_scheduler_type: constant_with_warmup
  logging_steps: 10
  deepspeed: ds_configs/stage2.json

runtime:
  dry_run_default: true
  save_predictions: true
  save_metrics: true
